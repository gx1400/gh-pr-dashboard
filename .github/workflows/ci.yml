name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs opt in to what they need. The repository is public
# and may take pull requests from forks, so no job gets write access.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Coverage floor. Raise it as tests land; never lower it to make a build pass.
  COVERAGE_MIN: "90"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install ruff
        run: python -m pip install "ruff==0.14.6"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check --diff .

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (stdlib tomllib); 3.15 is what the container ships.
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests with coverage gate
        run: |
          pytest -q \
            --cov=gh_pr_dashboard \
            --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_MIN}"

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only. Publishing happens from a release, never from a pull request,
      # so a fork cannot push an image.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: gh-pr-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Starts read-only as the image user, reads a mounted config, serves /healthz
        # and the page. GitHub calls fail without a token, which the page reports.
        run: |
          docker run --rm gh-pr-dashboard:ci --version
          printf '[[owners]]\nname = "octocat"\n' > "$RUNNER_TEMP/config.toml"
          chmod 644 "$RUNNER_TEMP/config.toml"
          docker run -d --name prd --read-only -p 18080:8080 \
            -v "$RUNNER_TEMP/config.toml:/config/config.toml:ro" gh-pr-dashboard:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ | grep -q "Open pull requests"
          curl -fsS http://127.0.0.1:18080/api/prs | grep -q '"owners": \["octocat"\]'
          docker logs prd
          docker rm -f prd

  ci-ok:
    # The one check a ruleset should require: it passes only when every job above
    # passed, so changing the matrix or adding a job never strands a required check.
    name: ci-ok
    if: always()
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A CI job ended with '$result'."
              exit 1
            fi
          done
